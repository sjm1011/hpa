<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="烏日健檢表單測試入口，提供夥伴進入各項健檢表單進行測試。">
  <title>烏日健檢表單｜測試入口</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #0b6b63;
      --primary-dark: #07534d;
      --primary-soft: #e8f5f2;
      --page: #f3f6f5;
      --surface: #ffffff;
      --text: #17211f;
      --muted: #60706c;
      --border: #d7e1de;
      --shadow: 0 14px 36px rgba(20, 52, 47, 0.1);
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 8%, rgba(11, 107, 99, 0.1), transparent 28rem),
        var(--page);
      line-height: 1.6;
    }

    .page-header {
      padding: 52px 20px 48px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary-dark), #0b7c71);
    }

    .header-inner,
    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      line-height: 1.3;
      letter-spacing: 0.04em;
    }

    .header-description {
      max-width: 680px;
      margin: 12px 0 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 1rem;
    }

    main {
      padding: 36px 0 64px;
    }

    .section-heading {
      margin-bottom: 22px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 1.35rem;
    }

    .section-heading p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .form-card {
      display: flex;
      min-height: 250px;
      flex-direction: column;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .form-card__number {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 12px;
      color: #ffffff;
      background: var(--primary);
      font-weight: 700;
    }

    .form-card h3 {
      margin: 22px 0 8px;
      font-size: 1.24rem;
      line-height: 1.4;
    }

    .form-card p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .form-card__action {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      padding: 10px 18px;
      border-radius: 10px;
      color: #ffffff;
      background: var(--primary);
      font-weight: 700;
      text-decoration: none;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .form-card__action:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .form-card__action:focus-visible {
      outline: 3px solid rgba(11, 107, 99, 0.28);
      outline-offset: 3px;
    }

    .form-card--pending {
      box-shadow: none;
    }

    .form-card--pending .form-card__number {
      color: #66736f;
      background: #e6ecea;
    }

    .form-card__status {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      padding: 10px 18px;
      border: 1px dashed #b7c4c0;
      border-radius: 10px;
      color: #6b7774;
      background: #f7f9f8;
      font-weight: 700;
    }

    footer {
      padding: 0 20px 32px;
      color: var(--muted);
      text-align: center;
      font-size: 0.88rem;
    }

    @media (max-width: 760px) {
      .page-header {
        padding: 38px 20px 36px;
      }

      main {
        padding-top: 28px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-card {
        min-height: 220px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .form-card__action {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <p class="eyebrow">WURI HEALTH EXAMINATION</p>
      <h1>烏日健檢表單</h1>
      <p class="header-description">請選擇要測試的網頁。各項表單仍在測試階段，填寫內容不會作為正式醫療紀錄。</p>
    </div>
  </header>

  <main>
    <section aria-labelledby="form-list-title">
      <div class="section-heading">
        <h2 id="form-list-title">測試網頁</h2>
        <p>目前開放 1 項，其他網頁將於完成後陸續加入。</p>
      </div>

      <div class="form-grid">
        <article class="form-card">
          <span class="form-card__number" aria-hidden="true">01</span>
          <h3>大腸癌篩檢</h3>
          <p>定量免疫法糞便潛血檢查服務檢查紀錄結果表單。</p>
          <a class="form-card__action" href="./iFOBT_1.html">進入網頁</a>
        </article>

        <article class="form-card form-card--pending">
          <span class="form-card__number" aria-hidden="true">02</span>
          <h3>第二張表單</h3>
          <p>此項目尚未開放，完成後將在此提供測試連結。</p>
          <span class="form-card__status">建置中</span>
        </article>

        <article class="form-card form-card--pending">
          <span class="form-card__number" aria-hidden="true">03</span>
          <h3>第三張表單</h3>
          <p>此項目尚未開放，完成後將在此提供測試連結。</p>
          <span class="form-card__status">建置中</span>
        </article>
      </div>
    </section>
  </main>

  <footer>烏日健檢表單測試入口</footer>
</body>
</html>
